name: Build Microsoft Store Package

on:
  workflow_dispatch:

jobs:
  build-store-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Store package (AppX/MSIX)
        run: npm run package:win:msix

      - name: Upload Store package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dummy-forge-store-package
          path: |
            release/**/*.appx
            release/**/*.appxbundle
            release/**/*.msix
            release/**/*.msixbundle
          if-no-files-found: error
