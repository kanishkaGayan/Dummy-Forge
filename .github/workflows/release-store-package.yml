name: Release Microsoft Store Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-store-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Store package (AppX/MSIX)
        run: npm run package:win:msix

      - name: Create GitHub release and upload Store package
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.appx
            release/**/*.appxbundle
            release/**/*.msix
            release/**/*.msixbundle
